[pytest]
testpaths = tests
pythonpath = .
# --strict-markers turns a typo'd @pytest.mark into an error rather than
# a silently-ignored decorator. --strict-config does the same for this
# file. -ra prints a summary of anything that did not simply pass, which
# is what makes a skipped test visible instead of invisible.
addopts = --strict-markers --strict-config -ra
filterwarnings =
    # python-jose 3.3.0 calls datetime.utcnow() internally on every token
    # decode. It is unmaintained, the call is not ours, and 175 copies of
    # the same warning per run buried everything else.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:jose.jwt
